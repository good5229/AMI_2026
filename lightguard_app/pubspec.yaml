name: lightguard_app

description: LightGuard MVP v0.1 using public streetlight assets + detector outputs.
publish_to: 'none'

version: 0.1.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/suyeong_v02_seed.json
    - assets/data/gangneung_v02_seed.json
    - assets/data/chungju_v02_seed.json
    - assets/data/suyeong_v02_objects.json
    - assets/data/simulation_scenarios_v02.json
    - assets/data/simulation_validation_results_v02.csv
    - assets/data/ami_events.csv
    - assets/data/context/
    - assets/data/ami_event_windows/
